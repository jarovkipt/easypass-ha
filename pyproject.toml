[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-easypass-homeassistant"
version = "0.1.0b1"
description = "Unofficial Thai Easy Pass integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "jarovkipt" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
test = [
  "homeassistant==2026.7.4",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-homeassistant-custom-component==0.13.348",
  "ruff>=0.12",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
